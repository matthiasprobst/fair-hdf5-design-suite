services:
  app:
    build: .
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, sys, urllib.request;
          response = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5);
          data = json.load(response);
          sys.exit(0 if data.get('status') == 'ok' and data.get('react_built') is True else 1)
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
