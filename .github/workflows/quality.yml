name: Quality
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -e ./backend -r backend/requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m unittest discover -s backend/tests -v

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run check --prefix frontend

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FAIR_HDF5_DATA_DIR: ${{ runner.temp }}/fair-browser-catalog
      FAIR_HDF5_PORT: 8000
      FAIR_UI_URL: http://127.0.0.1:8000
      FAIR_SCREENSHOT_DIR: ${{ runner.temp }}/fair-browser-screenshots
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e ./backend -r backend/requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - name: Run browser regressions against the production build
        shell: bash
        run: |
          python -m fair_hdf5 > "$RUNNER_TEMP/fair-api.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          import urllib.request
          for attempt in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=1).close()
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('API did not become ready')
          PY
          python tests/ui_playwright_editor.py
      - name: Upload browser evidence and server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-evidence
          retention-days: 7
          path: |
            ${{ runner.temp }}/fair-browser-screenshots
            ${{ runner.temp }}/fair-api.log
