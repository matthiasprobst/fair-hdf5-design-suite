target-version = "py310"
line-length = 100
include = ["backend/**/*.py", "tests/**/*.py", "app.py"]

[lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]

[lint.per-file-ignores]
"backend/fair_hdf5/compat.py" = ["F401"]  # Intentional legacy exports.
